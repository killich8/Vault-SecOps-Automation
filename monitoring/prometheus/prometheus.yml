global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "demo"
    project: "vault-secops"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  # Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Vault metrics (dev server)
  - job_name: "vault"
    metrics_path: "/v1/sys/metrics"
    params:
      format: ["prometheus"]
    scheme: "http"
    bearer_token: "root-token-demo"
    static_configs:
      - targets: ["vault:8200"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "vault_.*"
        action: keep

  # API Flask 
  - job_name: "api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:5000"]

  # Jenkins
  - job_name: "jenkins"
    metrics_path: "/jenkins/prometheus"
    static_configs:
      - targets: ["jenkins:8080"]
    basic_auth:
      username: "admin"
      password: "admin123"

  # MySQL exporter
  - job_name: "mysql"
    static_configs:
      - targets: ["mysql-exporter:9104"]

  # Node exporter
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
