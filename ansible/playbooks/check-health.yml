---
- name: Health check des services
  hosts: localhost
  gather_facts: yes

  vars:
    vault_addr: "{{ lookup('env','VAULT_ADDR') | default('http://vault:8200') }}"
    vault_token: "{{ lookup('env','VAULT_TOKEN') | default('root-token-demo') }}"
    api_addr: "http://api:5000/health"
    mysql_host: "mysql"
    vault_mysql_secret: "secret/data/mysql"

  tasks:

    # 1. Check Vault
    - name: Check Vault status
      uri:
        url: "{{ vault_addr }}/v1/sys/health"
        method: GET
      register: vault_health
      failed_when: false

    # 2. Check API
    - name: Check API status
      uri:
        url: "{{ api_addr }}"
        method: GET
      register: api_health
      failed_when: false

    # 3. Retrieve MySQL password from Vault
    - name: Retrieve MySQL password from Vault
      uri:
        url: "{{ vault_addr }}/v1/{{ vault_mysql_secret }}"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_token }}"
      register: mysql_secret
      failed_when: false

    - name: Extract MySQL password
      set_fact:
        mysql_password: "{{ mysql_secret.json.data.data.password | default('invalid') }}"

    # 4. Check MySQL
    - name: Check MySQL status
      shell: |
        mysqladmin -h {{ mysql_host }} -u root -p{{ mysql_password }} --skip-ssl ping 2>/dev/null
      register: mysql_health
      failed_when: false
      ignore_errors: yes
      no_log: true

    # 5. Display results
    - name: Display health status
      debug:
        msg:
          - "Vault: {{ 'UP' if vault_health.status == 200 else 'DOWN' }}"
          - "API: {{ 'UP' if api_health.status == 200 else 'DOWN' }}"
          - "MySQL: {{ 'UP' if mysql_health.rc == 0 else 'DOWN' }}"

    # 6. Write health report
    - name: Write health report
      copy:
        dest: "/logs/health-{{ ansible_date_time.epoch }}.txt"
        content: |
          Health Check Report - {{ ansible_date_time.iso8601 }}
          ==========================================
          Vault: {{ 'UP' if vault_health.status == 200 else 'DOWN' }}
          API: {{ 'UP' if api_health.status == 200 else 'DOWN' }}
          MySQL: {{ 'UP' if mysql_health.rc == 0 else 'DOWN' }}
