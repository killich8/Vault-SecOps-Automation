<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title> Dashboard - Jenkins Integration</title>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-u1O8rU1tIeiXMJ0Jr0s1vZl9Y2G5HNsq4CPGK/c/pX9nuSUXGKmzj2YkdE+5EYXPL3ZXl2bqsxNbE2zdr9iQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1a202c;
            color: #e2e8f0;
        }
        
        .header {
            background: linear-gradient(90deg, #4c1d95, #5b21b6);
            padding: 20px;
            text-align: center;
        }
        
        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: #2d3748;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #4a5568;
        }
        
        .card h3 {
            color: #a78bfa;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
        }
        
        .metric {
            font-size: 2.5em;
            font-weight: bold;
            color: #10b981;
        }
        
        .jenkins-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #374151;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .build-success { background: #065f46; }
        .build-failure { background: #7f1d1d; }
        .build-running { background: #78350f; }
        
        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #6d28d9;
            transform: scale(1.05);
        }
        
        .pipeline-stages {
            display: flex;
            gap: 5px;
            margin: 15px 0;
        }
        
        .stage {
            flex: 1;
            padding: 10px;
            background: #374151;
            border-radius: 5px;
            text-align: center;
            font-size: 12px;
            position: relative;
        }
        
        .stage.completed { background: #10b981; }
        .stage.running { 
            background: #f59e0b;
            animation: pulse 2s infinite;
        }
        .stage.pending { background: #6b7280; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        #console-output {
            background: #000;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            animation: blink 2s infinite;
        }
        
        .status-green { background: #10b981; }
        .status-red { background: #ef4444; }
        .status-yellow { background: #f59e0b; }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Automation Platform</h1>
        <p>Jenkins CI/CD Integration</p>
    </div>
    
    <div class="container">
        <!-- Metrics -->
        <div class="grid">
            <div class="card">
                <h3>Jenkins Builds</h3>
                <div class="metric" id="build-count">0</div>
                <div style="color: #9ca3af; margin-top: 10px;">
                    Last: <span id="last-build">-</span>
                </div>
            </div>
            
            <div class="card">
                <h3>Pipeline Status</h3>
                <div id="pipeline-status" class="jenkins-status">
                    <span class="status-indicator status-green"></span>
                    <span>Idle</span>
                </div>
                <div class="pipeline-stages">
                    <div class="stage pending">Init</div>
                    <div class="stage pending">Secrets</div>
                    <div class="stage pending">Rotate</div>
                    <div class="stage pending">Certs</div>
                    <div class="stage pending">Deploy</div>
                </div>
            </div>
            
            <div class="card">
                <h3>Vault Operations</h3>
                <div class="metric" id="vault-ops">0</div>
                <div style="color: #9ca3af; margin-top: 10px;">
                    Rotations & Certificates
                </div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="card">
            <h3>Jenkins Controls</h3>
            <button onclick="triggerPipeline()">Run Pipeline</button>
            <button onclick="triggerRotation()">Rotation</button>
            <button onclick="triggerCerts()">Generate Certs</button>
            <button onclick="abortPipeline()">Abort Current</button>
            <button onclick="getJenkinsStatus()">Get Status</button>
            <button onclick="viewLastBuild()">Last Build Log</button>
        </div>
        
        <!-- Console Output -->
        <div class="card">
            <h3>📺 Console Output</h3>
            <div id="console-output"></div>
        </div>
    </div>

    <script>
        let buildCount = 0;
        let vaultOps = 0;
        let currentStage = 0;
        let pipelineRunning = false;
        let pipelineInterval = null; // pour contrôler setInterval du pipeline

        function log(message, color = '#00ff00') {
            const consoleEl = document.getElementById('console-output');
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.style.color = color;
            line.textContent = `[${time}] ${message}`;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        async function triggerPipeline() {
            log('Triggering Jenkins pipeline...', '#ffff00');
            pipelineRunning = true;
            updatePipelineStatus('running');
            
            try {
                const response = await fetch('http://localhost:5000/webhook/trigger-jenkins', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({job: 'rotate-mysql'})
                });
                
                if (response.ok) {
                    log('Pipeline triggered successfully', '#00ff00');
                    buildCount++;
                    document.getElementById('build-count').textContent = buildCount;
                    document.getElementById('last-build').textContent = new Date().toLocaleTimeString();
                    simulatePipeline();
                } else {
                    log('Failed to trigger pipeline', '#ff0000');
                    updatePipelineStatus('failed');
                    pipelineRunning = false;
                }
            } catch (e) {
                log('Error: ' + e.message, '#ff0000');
                updatePipelineStatus('failed');
                pipelineRunning = false;
            }
        }

        async function triggerRotation() {
            log('Triggering rotation job...', '#ffff00');
            
            try {
                const response = await fetch('http://localhost:5000/webhook/trigger-jenkins', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({job: 'rotate-mysql'})
                });
                
                if (response.ok) {
                    log('Rotation job triggered', '#00ff00');
                    vaultOps++;
                    document.getElementById('vault-ops').textContent = vaultOps;
                } else {
                    log('Failed to trigger rotation', '#ff0000');
                }
            } catch (e) {
                log('Error: ' + e.message, '#ff0000');
            }
        }

        async function triggerCerts() {
            log('Generating certificates...', '#ffff00');
            
            const services = ['api', 'frontend', 'backend'];
            for (const service of services) {
                try {
                    const response = await fetch('http://localhost:5000/generate-cert', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({common_name: `${service}.local`})
                    });
                    
                    if (response.ok) {
                        log(`Certificate generated for ${service}.local`, '#00ff00');
                        vaultOps++;
                    } else {
                        log(`Cert request failed for ${service}.local`, '#ff0000');
                    }
                } catch (e) {
                    log(`Failed to generate cert for ${service}: ${e.message}`, '#ff0000');
                }
            }
            document.getElementById('vault-ops').textContent = vaultOps;
        }

        function simulatePipeline() {
            const stages = document.querySelectorAll('.stage');
            const stageNames = ['Init', 'Secrets', 'Rotate', 'Certs', 'Deploy'];
            currentStage = 0;

            // Reset visuel au début
            stages.forEach(s => s.className = 'stage pending');

            // Stopper un ancien interval si besoin
            if (pipelineInterval) {
                clearInterval(pipelineInterval);
            }

            pipelineInterval = setInterval(() => {
                if (!pipelineRunning) {
                    clearInterval(pipelineInterval);
                    return;
                }

                if (currentStage < stages.length) {
                    if (currentStage > 0) {
                        stages[currentStage - 1].className = 'stage completed';
                    }

                    stages[currentStage].className = 'stage running';
                    log(`Stage: ${stageNames[currentStage]} - Running...`, '#ffff00');
                    currentStage++;
                } else {
                    stages[stages.length - 1].className = 'stage completed';
                    clearInterval(pipelineInterval);
                    log('Pipeline completed successfully!', '#00ff00');
                    updatePipelineStatus('success');
                    pipelineRunning = false;
                }
            }, 2000);
        }

        function updatePipelineStatus(status) {
            const statusDiv = document.getElementById('pipeline-status');
            const statusMap = {
                'idle':    { icon: '🟢', text: 'Idle',    class: 'status-green' },
                'running': { icon: '🟡', text: 'Running', class: 'status-yellow' },
                'success': { icon: '🟢', text: 'Success', class: 'status-green' },
                'failed':  { icon: '🔴', text: 'Failed',  class: 'status-red' }
            };

            const s = statusMap[status] || statusMap['idle'];

            statusDiv.innerHTML = `
                <span class="status-indicator ${s.class}"></span>
                <span>${s.text}</span>
            `;

            if (status === 'success') {
                statusDiv.className = 'jenkins-status build-success';
            } else if (status === 'failed') {
                statusDiv.className = 'jenkins-status build-failure';
            } else if (status === 'running') {
                statusDiv.className = 'jenkins-status build-running';
            } else {
                statusDiv.className = 'jenkins-status';
            }
        }

        function abortPipeline() {
            if (pipelineRunning) {
                log('Aborting pipeline...', '#ff9900');
                pipelineRunning = false;

                if (pipelineInterval) {
                    clearInterval(pipelineInterval);
                }

                updatePipelineStatus('failed');

                document.querySelectorAll('.stage').forEach(s => {
                    s.className = 'stage pending';
                });
            } else {
                log('No pipeline running', '#999999');
            }
        }

        async function getJenkinsStatus() {
            log('Fetching Jenkins status (simulated)...', '#ffff00');
            
            // Simulation simple (tu pourras brancher l’API Jenkins plus tard)
            setTimeout(() => {
                log('Jenkins: Online', '#00ff00');
                log(`Total builds: ${buildCount}`, '#00ff00');
                log('Queue: Empty', '#00ff00');
                log('Executors: 2 available', '#00ff00');
            }, 500);
        }

        function viewLastBuild() {
            log('=== Last Build Output (simulated) ===', '#00ffff');
            log('[Jenkins] Starting Pipeline #' + buildCount, '#999999');
            log('[Jenkins] Agent: any', '#999999');
            log('[Jenkins] Stage: Initialize', '#999999');
            log('[Jenkins] + echo "Pipeline started"', '#999999');
            log('[Jenkins] Stage: Retrieve Secrets', '#999999');
            log('[Jenkins] + vault kv get secret/mysql', '#999999');
            log('[Jenkins] Secrets retrieved', '#00ff00');
            log('[Jenkins] Stage: Rotate', '#999999');
            log('[Jenkins] + ansible-playbook rotate-mysql.yml', '#999999');
            log('[Jenkins] Rotation completed', '#00ff00');
            log('[Jenkins] Pipeline completed: SUCCESS', '#00ff00');
            log('=== End of Output ===', '#00ffff');
        }

        // Init
        log('Dashboard initialized', '#00ffff');
        log('Connected to Jenkins & Vault', '#00ff00');
        
        // Auto-refresh health every 10s (API / Vault)
        setInterval(() => {
            if (!pipelineRunning) {
                fetch('http://localhost:5000/health')
                    .then(r => r.json())
                    .then(data => {
                        if (data.vault_connected) {
                            log('Health check: All systems operational', '#008800');
                        } else {
                            log('Health check: Vault disconnected', '#880000');
                        }
                    })
                    .catch(e => {
                        log('Health check failed: ' + e.message, '#880000');
                    });
            }
        }, 10000);
    </script>
</body>
</html>
